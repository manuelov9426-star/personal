<rect x="32" y="60" width="74" height="64" rx="9" fill="#101010"/>
<g class="flick"><rect x="38" y="68" width="10" height="7" fill="#8B95A1"/><rect x="56" y="80" width="8" height="6" fill="#B6FF2E"/><rect x="74" y="70" width="12" height="6" fill="#C4CDD6"/><rect x="88" y="88" width="9" height="7" fill="#8B95A1"/><rect x="44" y="100" width="12" height="6" fill="#C4CDD6"/><rect x="68" y="108" width="10" height="6" fill="#8B95A1"/></g>
<g class="flick2"><rect x="52" y="94" width="9" height="6" fill="#C4CDD6"/><rect x="80" y="102" width="11" height="7" fill="#B6FF2E"/><rect x="90" y="66" width="8" height="6" fill="#8B95A1"/><rect x="38" y="86" width="8" height="6" fill="#C4CDD6"/></g>
<circle cx="122" cy="76" r="7" fill="#F2EFE6"/>
<circle cx="122" cy="98" r="7" fill="#F2EFE6"/>
<rect x="112" y="112" width="20" height="8" rx="4" fill="#F2EFE6"/>
<rect x="34" y="136" width="18" height="10" rx="5" fill="#F2EFE6"/>
<rect x="108" y="136" width="18" height="10" rx="5" fill="#F2EFE6"/>
</symbol>

<!-- SMILEY · cultura: cero humo, cero drama -->
<symbol id="s-smiley" viewBox="0 0 160 160">
