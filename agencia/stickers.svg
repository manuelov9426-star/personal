</symbol>

<!-- STARBURST · para gritar cosas -->
<symbol id="s-star" viewBox="0 0 160 160">
<polygon class="wob" points="80.0,8.0 92.9,31.7 116.0,17.6 115.4,44.6 142.4,44.0 128.3,67.1 152.0,80.0 128.3,92.9 142.4,116.0 115.4,115.4 116.0,142.4 92.9,128.3 80.0,152.0 67.1,128.3 44.0,142.4 44.6,115.4 17.6,116.0 31.7,92.9 8.0,80.0 31.7,67.1 17.6,44.0 44.6,44.6 44.0,17.6 67.1,31.7" fill="#FF4FA3" stroke="#F2EFE6" stroke-width="6" stroke-linejoin="round"/>
