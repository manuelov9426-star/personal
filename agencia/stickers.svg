<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<style>
@media (prefers-reduced-motion: no-preference){
  .flick{animation:s-flick .9s steps(2) infinite}
  .flick2{animation:s-flick .7s steps(3) infinite;animation-delay:.25s}
  .wob{animation:s-wob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
}
@keyframes s-flick{50%{opacity:.15}}
@keyframes s-wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
</style>

<!-- OJO · medición: ve lo que otros maquillan -->
<symbol id="s-ojo" viewBox="0 0 160 160">
<path d="M38,44 L26,30 M80,36 L80,20 M122,44 L134,30" stroke="#F2EFE6" stroke-width="9" stroke-linecap="round"/>
<path d="M12,84 Q80,30 148,84 Q80,138 12,84 z" fill="#F2EFE6"/>
<circle cx="80" cy="84" r="30" fill="#B6FF2E"/>
<circle cx="80" cy="84" r="15" fill="#101010"/>
<circle cx="87" cy="77" r="5" fill="#fff"/>
</symbol>

<!-- MEGÁFONO · pauta: habla duro, mide más duro -->
<symbol id="s-mega" viewBox="0 0 160 160">
<g transform="rotate(-8 80 80)">
<path d="M122,46 q18,30 0,60" stroke="#B6FF2E" stroke-width="9" fill="none" stroke-linecap="round"/>
<path class="flick" d="M140,34 q26,44 0,88" stroke="#B6FF2E" stroke-width="9" fill="none" stroke-linecap="round" opacity=".65"/>
<rect x="14" y="60" width="38" height="36" rx="9" fill="#F2EFE6"/>
<path d="M48,54 L112,24 L112,132 L48,102 z" fill="#FF4FA3" stroke="#F2EFE6" stroke-width="7" stroke-linejoin="round"/>
<rect x="22" y="94" width="17" height="40" rx="8" fill="#F2EFE6"/>
</g>
</symbol>

<!-- DIANA · causal: en el centro o no cuenta -->
<symbol id="s-diana" viewBox="0 0 160 160">
<circle cx="72" cy="88" r="58" fill="#F2EFE6"/>
<circle cx="72" cy="88" r="42" fill="#FF4FA3"/>
<circle cx="72" cy="88" r="27" fill="#F2EFE6"/>
<circle cx="72" cy="88" r="13" fill="#101010"/>
<path d="M126,34 L78,82" stroke="#B6FF2E" stroke-width="10" stroke-linecap="round"/>
<path d="M72,88 L92,80 L80,68 z" fill="#B6FF2E"/>
<path d="M120,18 L136,34 M126,44 L142,60" stroke="#B6FF2E" stroke-width="9" stroke-linecap="round"/>
</symbol>

<!-- RAYO · ia: corre en producción -->
<symbol id="s-rayo" viewBox="0 0 160 160">
<path d="M94,8 L32,94 L70,94 L54,152 L128,60 L88,60 z" fill="#B6FF2E" stroke="#F2EFE6" stroke-width="8" stroke-linejoin="round"/>
</symbol>

<!-- TV · creativo: la estática también comunica -->
<symbol id="s-tv" viewBox="0 0 160 160">
<path d="M62,46 L42,16 M98,46 L122,14" stroke="#F2EFE6" stroke-width="7" stroke-linecap="round"/>
<circle cx="42" cy="16" r="7" fill="#FF4FA3"/>
<circle cx="122" cy="14" r="7" fill="#B6FF2E"/>
