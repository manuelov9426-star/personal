<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<style>
.blink{transform-box:fill-box;transform-origin:center}
.wag{transform-box:fill-box;transform-origin:10% 90%}
@media (prefers-reduced-motion: no-preference){
  .blink{animation:c-blink 4.4s infinite}
  .wag{animation:c-wag 1.4s ease-in-out infinite}
  .pulse{animation:c-pulse 2s ease-in-out infinite}
  .twinkle{animation:c-pulse 1.6s ease-in-out infinite}
}
@keyframes c-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
@keyframes c-wag{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(14deg)}}
@keyframes c-pulse{0%,100%{opacity:1}50%{opacity:.2}}
</style>

